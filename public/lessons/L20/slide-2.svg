<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#ca8a0499"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Card Container -->
  <rect x="60" y="40" width="1160" height="640" rx="20" fill="#ffffff" filter="url(#shadow)" opacity="0.92"/>
  <rect x="60" y="40" width="1160" height="640" rx="20" fill="none" stroke="#ca8a04" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Top accent bar -->
  <rect x="60" y="40" width="1160" height="6" rx="3" fill="url(#accent)"/>
  
  <!-- Lesson badge -->
  <rect x="90" y="65" width="110" height="34" rx="17" fill="#ca8a04" opacity="0.12"/>
  <text x="145" y="87" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ca8a04">L20</text>
  
  <!-- Slide counter badge -->
  <rect x="1080" y="65" width="110" height="34" rx="17" fill="#ca8a04" opacity="0.12"/>
  <text x="1135" y="87" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ca8a04">2 of 30</text>
  
  <!-- Emoji Icon -->
  <text x="640" y="195" text-anchor="middle" font-size="64">👋</text>
  
  <!-- Lesson Title -->
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#713f12" y="260">
    <tspan x="640" dy="0">Fixed Income &amp; Bonds</tspan>
  </text>
  
  <!-- Divider -->
  <rect x="540" y="310" width="200" height="3" rx="1.5" fill="#ca8a04" opacity="0.45"/>
  
  <!-- Step Name -->
  <text x="640" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#a16207">Introduction</text>
  
  <!-- Step Description -->
  <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#334155" y="397">
    <tspan x="640" dy="0">An introduction to Fixed Income &amp; Bonds. We discuss the historical</tspan>
        <tspan x="640" dy="28">context and why mastering this subject is essential for modern</tspan>
        <tspan x="640" dy="28">finance.</tspan>
  </text>
  
  <!-- Bottom watermark -->
  <text x="640" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" opacity="0.6" font-weight="600">FinGenIQ · Institutional Financial Intelligence</text>
</svg>