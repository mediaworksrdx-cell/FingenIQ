<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070E1A"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CEAE56"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="1180" y1="0" x2="1180" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Main Card Container -->
  <rect x="50" y="35" width="1180" height="650" rx="20" fill="#091122" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Top Gold Accent Line -->
  <rect x="50" y="35" width="1180" height="4" rx="2" fill="url(#goldBar)"/>

  <!-- Top Header Row -->
  <g transform="translate(90, 65)">
    <!-- Lesson & Module Badge -->
    <rect x="0" y="0" width="150" height="34" rx="8" fill="rgba(206,174,86,0.15)" stroke="rgba(206,174,86,0.3)"/>
    <text x="75" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#CEAE56" text-anchor="middle">L12 · MODULE 1</text>
    
    <!-- Section Identifier Badge -->
    <rect x="165" y="0" width="260" height="34" rx="8" fill="rgba(96,165,250,0.12)" stroke="#60A5FA" stroke-opacity="0.4"/>
    <text x="295" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">SECTION 02 · INTRODUCTION</text>
    
    <!-- Slide Counter Badge (X of 20) -->
    <rect x="940" y="0" width="150" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="1015" y="22" font-family="monospace" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle">2 of 20</text>
  </g>

  <!-- Lesson Title & Section Headline -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#F1F5F9">
      Technical Analysis
    </text>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#60A5FA">
      🎯 Introduction & Context
    </text>
    <line x1="0" y1="58" x2="300" y2="58" stroke="#60A5FA" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Section Lecture Content Body -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#CBD5E1" line-height="1.6">
    <tspan x="100" y="350">An introduction to Technical Analysis. We discuss the historical</tspan>
<tspan x="100" y="376">context and why mastering this subject is essential for modern finance.</tspan>

  </text>

  <!-- Custom Visual Content Per Section -->
  
        <g transform="translate(100, 485)">
          <rect x="0" y="0" width="1080" height="85" rx="12" fill="#0B1528" stroke="#1E293B" stroke-width="1.5"/>
          <circle cx="50" cy="42" r="22" fill="rgba(96,165,250,0.12)"/>
          <text x="50" y="49" font-size="18" text-anchor="middle">🎯</text>
          <text x="90" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#60A5FA">SECTION 02 · INTRODUCTION</text>
          <text x="90" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#8898AA">Review associated lecture notes, quantitative formulas, and case material in the FinGenIQ curriculum portal.</text>
        </g>
        

  <!-- Footer Watermark -->
  <g transform="translate(100, 655)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">
      FinGenIQ · Institutional Financial Architecture &amp; Valuation Intelligence
    </text>
    <text x="1080" y="0" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">
      L12.S02 · 2026 Curriculum Standard
    </text>
  </g>
</svg>