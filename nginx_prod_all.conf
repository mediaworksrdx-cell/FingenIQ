# ─── 4. HTTP TO HTTPS 301 REDIRECTS ───────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aarka-ai.com www.aarka-ai.com synthetixanalytics.com www.synthetixanalytics.com fingeniq.com www.fingeniq.com 136.85.114.150;

    return 301 https://$host$request_uri;
}
